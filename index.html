<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FURIOUS DRIVE V9 - HORIZONTAL</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#111;color:#fff;text-align:center}header{display:flex;justify-content:space-between;padding:8px 12px;background:#0a0a2e}.logo{font-size:19px;font-weight:900;color:#FFD700}.coins{background:#ffd700;color:#000;padding:7px 13px;border-radius:20px;font-weight:900}#main{display:flex;gap:8px;padding:6px}#left{flex:1;text-align:left}#gameWrap{flex:2.2;position:relative;height:62vh;background:#2e7d32;overflow:hidden;border:4px solid #00f0ff;border-radius:10px}canvas{width:100%;height:100%;display:block}#hud{display:flex;justify-content:space-around;padding:6px;font-weight:900;background:#000;font-size:14px}#controls{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#0f0a2e}#wheel{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#ccc 0%,#333 60%,#111 100%);border:8px solid #111;display:flex;align-items:center;justify-content:center;font-weight:900;touch-action:none}.pedal{width:68px;height:88px;border-radius:12px;font-weight:900;border:none;color:#fff;font-size:16px;touch-action:none}#gas{background:#00c853}#brake{background:#e53935}#nitro{background:#ffea00;color:#000;width:90px;height:44px;border-radius:20px;font-weight:900;border:none}.card{background:#1a1a4a;margin:6px 0;padding:9px;border-radius:12px;text-align:left}input{padding:10px;width:90%;border-radius:10px;border:none;margin:3px}button{padding:10px 12px;border-radius:10px;border:none;font-weight:900;cursor:pointer;background:#ff0066;color:#fff;margin:3px;font-size:14px}.modeBtn{background:#444}.modeBtn.active{background:#00f0ff;color:#000}.carbtn{background:#fff;color:#000}.carbtn.active{background:#00f0ff}#shop{position:fixed;inset:0;background:rgba(0,0,0,.97);display:none;padding:18px;overflow:auto}.paybtn{background:#00c853;width:100%;text-align:left}.soundBtn{background:#333}@media(max-width:700px){#main{flex-direction:column}#gameWrap{height:52vh}}</style></head><body><header><div class="logo">FURIOUS DRIVE ★ V9 HORIZONTAL</div><div>👤 <span id="myUser">Guest</span> | <div class="coins" onclick="openShop()">🪙 <span id="coinBal">0</span> SHOP</div></div></header><div id="hud"><div>LAP <span id="lap">1</span>/3</div><div>POS <span id="pos">2</span>/6</div><div><span id="speed">0</span> KM/H</div><div>🏆 <span id="leader">Jay</span></div><div>📍 Lekki - Turn phone ↔️</div></div><div id="main"><div id="left"><div class="card" id="auth"><h3 style="margin:2px">🏁 JOIN - +200 FREE!</h3><input id="regUser" placeholder="Username"><br><input id="regPass" type="password" placeholder="Password"><br><button onclick="register()" style="background:#00c853;width:92%">✅ REGISTER / LOGIN +200</button><button class="soundBtn" onclick="toggleSound()" id="soundBtn">🔊 SOUND: ON</button><p id="regMsg" style="color:#FFD700;font-weight:900"></p></div><div class="card"><h3 style="margin:2px">🎮 MODE</h3><button class="modeBtn active" onclick="setMode('bots',this)">🤖 BOTS</button><button class="modeBtn" onclick="setMode('invite',this)">📨 INVITE</button><button class="modeBtn" onclick="setMode('random',this)">🌍 RANDOM</button><p id="modeDesc">📍 Lekki-Epe, Lagos. Vs Ada, Tobi, Zara, Jay, Ken</p><h3 style="margin:2px">🏎️ GARAGE</h3><button class="carbtn active" onclick="selectCar(this,'#ff0000','Lambo',0)">🔴 Lambo FREE</button><button class="carbtn" onclick="selectCar(this,'#00f0ff','Camaro',500)">🔵 Camaro 500</button><button class="carbtn" onclick="selectCar(this,'#FFD700','Ferrari',2500)">🟡 Ferrari 2500</button><br><button onclick="startRace()" style="background:#00c853" id="startBtn">▶ START LEKKI 🏁</button><button onclick="horn()">📯 HORN</button><button onclick="resetRace()">🔄 RESET</button><p id="status">Turn phone sideways ↔️! Volume UP! Win = +100</p></div></div><div id="gameWrap"><canvas id="cv" width="700" height="360"></canvas></div></div><div id="controls"><div><button id="nitro">⚡ NITRO</button><br><button class="pedal" id="brake">BRAKE</button></div><div id="wheel">🎡 STEER</div><div><button class="pedal" id="gas">GAS 🔊</button></div></div><div id="shop"><h2>🪙 SHOP - Paystack</h2><p>Balance: <span id="coinBal2">0</span> coins</p><button class="paybtn" onclick="buy(1000,100,'₦')">🇳🇬 1000 Coins - ₦100</button><button class="paybtn" onclick="buy(5000,500,'₦')">🇳🇬 5000 Coins - ₦500</button><button class="paybtn" onclick="buy(10000,1000,'₦')">🇳🇬 10000 Coins - ₦1000</button><button class="paybtn" onclick="buy(1000,1,'$')">🇺🇸 1000 Coins - $1</button><br><button onclick="closeShop()">CLOSE</button></div><script>let coins=0,speed=0,myX=350,lap=1,steer=0,myUser='Guest',racing=false,myDist=0,gasOn=false,brakeOn=false,registered=false,myColor='#ff0000',myCar='Lambo',soundOn=true,roadY=0,opponent='';let ctx=document.getElementById('cv').getContext('2d');let audioCtx=null,osc=null,gain=null;function initAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();gain=audioCtx.createGain();gain.gain.value=0;gain.connect(audioCtx.destination);osc=audioCtx.createOscillator();osc.type='sawtooth';osc.frequency.value=60;osc.connect(gain);osc.start()}catch(e){}}}function engineSound(){if(!soundOn||!audioCtx)return;let t=gasOn?0.12+speed/1200:0.02;gain.gain.value+=(t-gain.gain.value)*0.2;if(osc)osc.frequency.value=50+speed*0.9}function playBeep(f,d){if(!soundOn)return;initAudio();try{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.value=0.2;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}function horn(){playBeep(400,0.4)}function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').innerText=soundOn?'🔊 SOUND: ON':'🔇 SOUND: OFF'}function updateCoins(){document.getElementById('coinBal').innerText=coins;document.getElementById('coinBal2').innerText=coins}let bots=[{name:'Ada',color:'#00ff00',x:150,dist:120,speed:90},{name:'Tobi',color:'#0088ff',x:350,dist:180,speed:100},{name:'Zara',color:'#ff00ff',x:530,dist:90,speed:85},{name:'Jay',color:'#ffff00',x:250,dist:220,speed:110},{name:'Ken',color:'#ff8800',x:450,dist:60,speed:80}];function setMode(m,btn){document.querySelectorAll('.modeBtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(m=='bots'){document.getElementById('modeDesc').innerText='📍 Lekki-Epe. Vs Ada, Tobi, Zara, Jay, Ken';document.getElementById('startBtn').innerText='▶ START LEKKI 🏁'}if(m=='invite'){let f=prompt('Friend username:');if(f){opponent=f;document.getElementById('modeDesc').innerText='📨 Invite sent to '+f;document.getElementById('startBtn').innerText='▶ START VS '+f.toUpperCase()}}if(m=='random'){let pool=['Ada123','Tobi_Boy','ZaraQueen','Jay_Racer','KenFast'];opponent=pool[Math.floor(Math.random()*pool.length)];document.getElementById('modeDesc').innerText='🌍 Random: '+opponent;document.getElementById('startBtn').innerText='▶ START VS '+opponent.toUpperCase()}}function register(){let u=document.getElementById('regUser').value.trim();let p=document.getElementById('regPass').value;if(!u||!p){document.getElementById('regMsg').innerText='⚠️ Type username + password!';return}initAudio();myUser=u;document.getElementById('myUser').innerText=u;if(!registered){coins+=200;registered=true;updateCoins()}document.getElementById('auth').style.display='none';alert('Welcome '+u+'! +200 coins! Turn phone sideways!')}function openShop(){document.getElementById('shop').style.display='block'}function closeShop(){document.getElementById('shop').style.display='none'}function buy(c,amt,sym){if(confirm('Paystack: '+sym+amt+' for '+c+' coins?')){coins+=c;updateCoins();alert('✅ +'+c+' coins! Balance: '+coins);closeShop()}}function selectCar(b,color,name,cost){if(cost>coins){alert('Not enough coins! Win +100 or buy SHOP');return}coins-=cost;updateCoins();myColor=color;myCar=name;document.querySelectorAll('.carbtn').forEach(z=>z.classList.remove('active'));b.classList.add('active')}function resetRace(){racing=false;myDist=0;lap=1;speed=0;myX=350;document.getElementById('lap').innerText=1}function startRace(){initAudio();racing=true;myDist=0;lap=1;speed=0;document.getElementById('status').innerText='🏁 RACING LEKKI! HOLD GAS!';playBeep(600,0.3)}function drawCar(x,y,color,isYou){ctx.fillStyle='#111';ctx.fillRect(x-18,y+8,14,18);ctx.fillRect(x+6,y+8,14,18);ctx.fillRect(x-18,y-22,14,18);ctx.fillRect(x+6,y-22,14,18);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x-20,y+30);ctx.lineTo(x-20,y-10);ctx.quadraticCurveTo(x-20,y-30,x,y-32);ctx.quadraticCurveTo(x+20,y-30,x+20,y-10);ctx.lineTo(x+20,y+30);ctx.closePath();ctx.fill();ctx.fillStyle='#aee';ctx.fillRect(x-12,y-18,24,14);ctx.fillStyle='#fff';ctx.fillRect(x-14,y+18,28,4)}function drawRoad(){ctx.fillStyle='#2e7d32';ctx.fillRect(0,0,700,360);ctx.fillStyle='#555';ctx.fillRect(60,0,580,360);ctx.fillStyle='#fff';for(let i=0;i<6;i++){let y=((i*70+roadY)%420)-20;ctx.fillRect(270,y,6,40);ctx.fillRect(420,y,6,40)}ctx.fillStyle='#FFD700';ctx.fillRect(60,0,6,360);ctx.fillRect(634,0,6,360);ctx.fillStyle='#fff';ctx.font='bold 13px Arial';ctx.textAlign='left';ctx.fillText('📍 LEKKI - EPE EXPRESSWAY - LAGOS 🇳🇬',75,20)}setInterval(()=>{if(gasOn)speed=Math.min(speed+4,220);else if(brakeOn)speed=Math.max(speed-9,0);else speed=Math.max(speed-0.6,0);roadY+=speed/8;if(roadY>70)roadY=0;if(racing){myDist+=speed/10;myX+=steer*3;myX=Math.max(95,Math.min(605,myX));if(myDist>800){myDist=0;lap++;document.getElementById('lap').innerText=Math.min(lap,3);playBeep(800,0.3);if(lap>3){racing=false;coins+=100;updateCoins();alert('FINISH! +100 coins! Balance: '+coins);lap=1}}}engineSound();ctx.clearRect(0,0,700,360);drawRoad();bots.forEach(b=>{b.dist+=b.speed/10;b.x+=(Math.random()-0.5)*2;b.x=Math.max(95,Math.min(605,b.x));let yy=280-((b.dist-myDist)%420);if(yy<-40)yy+=420;drawCar(b.x,yy,b.color,false);ctx.fillStyle='#000';ctx.fillRect(b.x-18,yy+38,36,12);ctx.fillStyle='#fff';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText(b.name,b.x,yy+47)});drawCar(myX,280,myColor,true);ctx.fillStyle='#000';ctx.fillRect(myX-22,318,44,12);ctx.fillStyle='#FFD700';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.fillText(myUser,myX,327);let all=[{name:myUser,dist:myDist},...bots].sort((a,b)=>b.dist-a.dist);document.getElementById('pos').innerText=all.findIndex(a=>a.name===myUser)+1;document.getElementById('leader').innerText=all[0].name;document.getElementById('speed').innerText=Math.round(speed)},50);let wheel=document.getElementById('wheel');function setSteer(v){steer=v;wheel.style.transform='rotate('+(steer*45)+'deg)'}wheel.addEventListener('touchmove',e=>{e.preventDefault();let t=e.touches[0];let r=wheel.getBoundingClientRect();setSteer((t.clientX-(r.left+r.width/2))/40)},{passive:false});wheel.addEventListener('touchend',()=>setSteer(0));let gasBtn=document.getElementById('gas');let brakeBtn=document.getElementById('brake');gasBtn.addEventListener('touchstart',e=>{e.preventDefault();initAudio();gasOn=true},{passive:false});gasBtn.addEventListener('touchend',()=>gasOn=false);brakeBtn.addEventListener('touchstart',e=>{e.preventDefault();brakeOn=true},{passive:false});brakeBtn.addEventListener('touchend',()=>brakeOn=false);document.getElementById('nitro').addEventListener('click',()=>{speed=Math.min(speed+70,260);playBeep(1200,0.4)});</script></body></html>
